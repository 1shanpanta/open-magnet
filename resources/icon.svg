    <circle cx="281" cy="335" r="11" fill="#28CA42"/>
    <circle cx="575" cy="335" r="11" fill="#FF5F57"/>
    <circle cx="604" cy="335" r="11" fill="#FFBD2E"/>
    <circle cx="633" cy="335" r="11" fill="#28CA42"/>
